services:
  - type: web
    name: tadabbur
    runtime: docker
    plan: free

    healthCheckPath: /

    envVars:
      - key: APP_NAME
        value: Tadabbur

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: false

      - key: APP_KEY
        generateValue: true

      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: sqlite

      - key: SESSION_DRIVER
        value: file

      - key: CACHE_STORE
        value: file

      - key: QUEUE_CONNECTION
        value: sync
