services:
  - type: web
    name: tadabbur
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: Tadabbur
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
